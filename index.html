<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymPlan</title>
<meta name="description" content="จัดโปรแกรมออกกำลังกายตามอุปกรณ์ที่มี พร้อมบันทึก progress">
<meta name="theme-color" content="#16181d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f4f1; --surface: #ffffff; --surface-2: #ecebe6; --line: #dddbd3;
  --text: #16181d; --muted: #6b6e76; --accent: #e8492a; --accent-ink: #ffffff;
  --accent-soft: #fde6df; --good: #1f8a4c; --warn-bg: #fff4d6; --warn-ink: #7a5500;
  --danger: #c62f2f; --chart: #e8492a; --grid: #e4e2db;
  --radius: 16px; --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1b1e24; --surface-2: #252932; --line: #2e333d;
    --text: #f1f1ee; --muted: #9a9ea8; --accent: #ff6a47; --accent-ink: #1a0d08;
    --accent-soft: #3a2019; --good: #4cc27d; --warn-bg: #3a3015; --warn-ink: #f0cf7a;
    --danger: #ff6b6b; --chart: #ff6a47; --grid: #2a2e37; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1b1e24; --surface-2: #252932; --line: #2e333d;
  --text: #f1f1ee; --muted: #9a9ea8; --accent: #ff6a47; --accent-ink: #1a0d08;
  --accent-soft: #3a2019; --good: #4cc27d; --warn-bg: #3a3015; --warn-ink: #f0cf7a;
  --danger: #ff6b6b; --chart: #ff6a47; --grid: #2a2e37; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.5 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; overscroll-behavior-y: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { text-align: center; }
.mt { margin-top: 12px; }
.row { display: flex; align-items: center; }
.row.gap { gap: 8px; }
.row.between { justify-content: space-between; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.center-row { justify-content: center; margin: 4px 0 12px; }
.grow { flex: 1; min-width: 0; }
.left { text-align: left; display: flex; align-items: center; gap: 10px; }

.view { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
.page-title { margin: 8px 0 16px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.card.warn, .warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; font-size: 14px; }
div.warn { padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
.card.notice { border-color: var(--accent); }
.card.empty { text-align: center; padding: 32px 16px; }
.card.empty p { margin: 4px 0; }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.brand b { color: var(--accent); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 600; transition: transform .08s, opacity .15s; white-space: nowrap; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; pointer-events: none; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.big { min-height: 54px; font-size: 17px; width: 100%; margin-top: 14px; }
.btn.full { width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--text); color: var(--bg); }
.btn.ghost { background: var(--surface-2); }
.btn.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1px currentColor; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; flex-shrink: 0; }
.icon-btn:active { background: var(--surface-2); }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; }

/* inputs */
.input { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); outline: none; }
.input:focus { border-color: var(--accent); }
.input.num { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 6px; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
.lbl:first-child { margin-top: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { flex: 1 1 auto; min-height: 40px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; text-align: center; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.checks { display: grid; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.check .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); flex-shrink: 0; display: grid; place-items: center; }
.check.on { background: var(--accent-soft); }
.check.on .box { background: var(--accent); border-color: var(--accent); }
.check.on .box::after { content: '✓'; color: var(--accent-ink); font-size: 13px; font-weight: 700; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; background: var(--surface-2); font-size: 12px; font-weight: 500; }
.btn-chip { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-chip.on { background: var(--accent); color: var(--accent-ink); }
.small-chips { margin-top: 6px; }
.tag { font-size: 12px; color: var(--muted); background: var(--surface-2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; }

.option { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 14px; border-radius: 12px; background: var(--surface-2); margin-bottom: 8px; }
.option.on { box-shadow: inset 0 0 0 2px var(--accent); background: var(--accent-soft); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; display: inline-block; }
.option.on .radio, .radio.on { border: 6px solid var(--accent); }

.ex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.ex-row:first-of-type { margin-top: 10px; }
.col-btns { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

/* onboarding */
.onboard { padding-bottom: 110px; }
.ob-head { margin: 8px 0 18px; }
.ob-head h1 { margin-top: 18px; }
.steps { display: flex; gap: 6px; margin-top: 16px; }
.steps span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); }
.steps span.on { background: var(--accent); }
.ob-actions { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); max-width: 560px; margin: 0 auto; }
.ob-actions .btn { min-width: 120px; }

/* home */
.home-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.gym-pill { background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 99px; font-size: 13px; font-weight: 500; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.stat .num { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .num small { font-size: 14px; color: var(--muted); font-weight: 500; }
.hero h2 { font-size: 24px; margin: 4px 0 10px; }

/* workout */
.workout { padding-top: 0; padding-bottom: 140px; }
.wo-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 0 10px; background: var(--bg); }
.wo-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.wo-title b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progressbar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.progressbar span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.item.done { opacity: .72; }
.item-head { display: flex; align-items: flex-start; gap: 10px; }
.item-idx { width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; margin-top: 2px; }
.item.done .item-idx { background: var(--good); color: #fff; }
.last { margin-top: 10px; color: var(--muted); }
.sug { margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); }
.sug.up { background: var(--accent-soft); color: var(--text); font-weight: 500; }
.sets { margin: 12px 0 10px; display: grid; gap: 6px; }
.set-row { display: grid; grid-template-columns: 36px 1fr 1fr 48px; gap: 8px; align-items: center; }
.set-headrow { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; }
.set-n { text-align: center; font-weight: 600; color: var(--muted); }
.set-row.done .input { background: transparent; border-color: transparent; color: var(--good); }
.tick { width: 48px; height: 44px; border-radius: 10px; background: var(--surface-2); font-size: 20px; font-weight: 700; color: var(--muted); display: grid; place-items: center; text-align: center; }
.tick.on { background: var(--good); color: #fff; }
.spacer { height: 30px; }

/* rest timer */
#rest-timer { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto; background: var(--text); color: var(--bg); border-radius: 16px; overflow: hidden; transform: translateY(150%); transition: transform .25s; z-index: 20; }
#rest-timer.show { transform: none; }
#rest-timer .muted { color: inherit; opacity: .7; }
.rt-bar { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .35; transition: width .5s linear; }
.rt-body { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; }
.rt-body b { font-size: 26px; font-variant-numeric: tabular-nums; flex: 1; }
.rt-body .btn.ghost { background: rgba(127,127,127,.25); color: inherit; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; color: var(--muted); font-size: 11px; font-weight: 500; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }

/* sheet */
#sheet { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
#sheet.show { pointer-events: auto; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); animation: fade .2s; }
.sheet-panel { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 85vh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .25s ease-out; }
.sheet-panel h2 { margin-bottom: 6px; }
.sheet-panel > p { margin: 0 0 12px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.menu { display: grid; gap: 6px; margin-top: 10px; }
.menu button, .menu a { display: flex; flex-direction: column; min-height: 48px; justify-content: center; padding: 10px 14px; border-radius: 12px; background: var(--surface-2); font-weight: 500; color: var(--text); text-decoration: none; }
.menu small { color: var(--muted); font-weight: 400; font-size: 12px; }
.menu .danger { color: var(--danger); }
.notice-text { background: var(--accent-soft); padding: 8px 12px; border-radius: 10px; }
.summary { text-align: center; }
.summary .stats { margin-top: 16px; }
.big-emoji { font-size: 48px; }
.pr-box { background: var(--accent-soft); padding: 12px; border-radius: 12px; font-weight: 600; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

/* history */
.session-head { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 10px; }
.chev { font-size: 24px; color: var(--muted); transition: transform .2s; }
.chev.open { transform: rotate(90deg); }
.session-body { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.hist-ex { padding: 6px 0; }

/* progress */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 6px; }
.kpis div { display: flex; flex-direction: column; }
.kpis b { font-size: 20px; font-variant-numeric: tabular-nums; }
.kpis b small { font-size: 12px; color: var(--muted); font-weight: 500; }
.pos { color: var(--good); } .neg { color: var(--danger); }
.chart { position: relative; margin-top: 8px; touch-action: pan-y; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 10px; }
.chart .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart .hover-dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
.chart .cross { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; transform: translate(-50%, -100%); background: var(--text); color: var(--bg); padding: 4px 8px; border-radius: 8px; font-size: 12px; display: flex; flex-direction: column; align-items: center; pointer-events: none; white-space: nowrap; line-height: 1.3; }
.tip .muted { color: inherit; opacity: .7; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tbl th, .tbl td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td:last-child, .tbl th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--muted); }
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 96px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
.bar-track { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.bar-zone { position: absolute; top: 0; bottom: 0; background: var(--good); opacity: .15; }
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--chart); border-radius: 0 4px 4px 0; }
.bar-val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* settings */
.list .list-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 48px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.list .list-item:last-of-type { border-bottom: 0; }
.sub-head { display: flex; align-items: center; gap: 6px; margin: 4px 0 14px; }
.sub-head h1 { font-size: 20px; }
.sub-head .icon-btn { font-size: 30px; }
label.btn { cursor: pointer; }

/* toast */
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translate(-50%, -150%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; z-index: 40; transition: transform .25s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app"></div>
<div id="rest-timer"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
